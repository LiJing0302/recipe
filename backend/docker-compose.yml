services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe_ai
    ports:
      - "5432:5432"
    volumes:
      - recipe_ai_postgres_data:/var/lib/postgresql/data

volumes:
  recipe_ai_postgres_data:
